name: Playwright Daily Regression

on:
  schedule:
    # 9 AM IST = 3:30 AM UTC
    - cron: "30 3 * * *"

  workflow_dispatch:

jobs:
  playwright-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4

        with:
          ref: develop

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npm run test

      - name: Upload Playwright Report
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: playwright-report

          path: playwright-report/

      - name: Checkout test-results branch
        if: always()

        uses: actions/checkout@v4

        with:
          ref: test-results

          path: results

      - name: Copy test results
        if: always()

        run: |

          rm -rf results/report

          cp -r playwright-report results/report

      - name: Commit results
        if: always()

        run: |

          cd results

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Daily Playwright test results $(date)" || echo "No changes"

          git push
